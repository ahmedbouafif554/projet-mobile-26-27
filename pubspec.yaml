name: superfaster
description: "SuperFaster - application de livraison (restaurants, courses, colis). Frontend uniquement, données mock."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Navigation déclarative (routes, barre du bas, transitions personnalisées)
  go_router: ^17.0.0
  # Polices Poppins (titres) et Inter (texte)
  google_fonts: ^6.3.2
  # Animations déclaratives : cascades, micro-interactions
  flutter_animate: ^4.5.2
  # Effet shimmer pendant les chargements simulés
  shimmer: ^3.0.0
  # Animations Lottie (bienvenue, commande confirmée, panier vide)
  lottie: ^3.3.1
  # Client HTTP des dépôts « API » (le mode mock reste activé par défaut)
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
